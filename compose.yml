services:
  app:
    build:
      context: .
      target: production
      args:
        - ARTIFACT_NAME=${ARTIFACT_NAME}
    ports:
      - ${HOST_PORT:-8082}:8080
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 5
    networks:
      - fullstack_accounting
    depends_on:
      - db
    profiles: ["manual"]

  db:
    image: mysql:lts
    ports:
      - ${HOST_DB_PORT:-3306}:3306
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fullstack_accounting

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - ${PHPMYADMIN_PORT:-8088}:80
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - fullstack_accounting
    depends_on:
      - db

volumes:
  mysql_data:

networks:
  fullstack_accounting:
    name: fullstack_accounting
